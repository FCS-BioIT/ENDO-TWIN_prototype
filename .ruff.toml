# Ruff settings for `pixi run lint` and `pixi run format-check`.
#
# Lint uses ruff's defaults.

# `src/scripts/` moved here from the repository root on 2026-11-23 to shrink the
# root listing. It was never inside `ruff check src tests` before that move, and
# it does not pass: 7 lint findings and 4 files the formatter would rewrite.
# Excluding it keeps the checked set exactly what it was, so the move stays a
# pure relocation. Nothing previously enforced is hidden by this -- but the
# findings are real and deserve their own pass.
#
# A top-level exclude applies to the linter and the formatter alike.
exclude = ["src/scripts"]

# Two files are left out of the formatter because reformatting them is not free:
# their exact bytes are recorded elsewhere.
[format]
exclude = [
    # Inside concordance.simulate.IMPLEMENTATION_GLOBS: any byte change moves the
    # implementation digest and forces regenerating the five digest-stamped
    # artifacts (docs/verification/README.md).
    "src/dt_adoc/protocols/conditions.py",
    # Hash-pinned by the closed C2 overlay
    # (docs/c2_observation_compartments/attribution_summary.json).
    "src/dt_adoc/observations/compartment_attribution.py",
]
