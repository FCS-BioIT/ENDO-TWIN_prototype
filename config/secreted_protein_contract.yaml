# Contract for the ADOC secreted-protein canonical input table.
#
# SCOPE: this file declares the machine-checkable shape of
# input_tables/adoc_secreted_proteins.tsv, built from
# data/proteinas secretadas ADOC.xlsx by
# src/dt_adoc/data/secreted_proteins.py::build_and_validate. It does not
# restate biology; see docs/data-context/adoc-secreted-proteins.md for
# provenance and dt_adoc.data.secreted_proteins for the discrepancies the
# transform preserves rather than papers over.

# Two sources back this table. `data/proteinas secretadas ADOC.xlsx` is the
# MEASUREMENT source and the only source of values. The annotation workbook
# `data/secreción proteinas ADOC anotaciones.xlsx` arrived on 2026-07-29 and
# supplies metadata only -- its numeric cells are byte-identical. It is
# gitignored for privacy, so its facts reach this table through the committed
# transcription in config/adoc_outlet_conditions.tsv rather than being read
# directly; that keeps `pixi run build-protein-table` reproducible on a clone
# that lacks the file.
#
# Collaborator statements confirmed 2026-07-29 are evidence SOFIA-COMM-001..005;
# annotation-workbook facts are SOFIA-ANNO-001..007. Both are in
# context/evidence-register.tsv and narrated in
# docs/collaborator_metadata_2026-07-29.md.

schema_version: "1.2"
dataset_id: adoc_secreted_proteins

# This file IS the one-row-per-measurement ADOC outlet record. It was requested
# under the name "adoc_outlet_measurements"; no such file exists or should be
# created, because a second table over the same 62 cells would be the duplicate
# record the request exists to avoid.
table_aliases:
  - adoc_outlet_measurements
related_tables:
  conditions: config/adoc_outlet_conditions.tsv
  sample_provenance: config/adoc_chip_donor_provenance.tsv
source_workbook: data/proteinas secretadas ADOC.xlsx

# The workbook offers no finer granularity than one value per data cell
# (no assay-well data exists in the source file).
observation_level: "one row per workbook data cell"

uniqueness_key:
  - source_sheet
  - source_cell

columns:
  - dataset_id
  - source_file
  - source_sheet
  - source_cell
  - source_row
  - source_column
  - source_label
  - protein
  - series_id
  - chip_id
  - chip_id_verbatim
  - donor_id
  - technical_replicate_id
  - assay_well_id
  - compartment
  - outlet
  - outlet_assignment_basis
  - compartment_semantics_basis
  - condition
  - condition_normalized
  - condition_resolution_note
  - protocol_phase
  - source_time_label
  - resolved_protocol_day
  - hours_after_cocktail_start
  - hours_after_e2_start
  - time_resolution_note
  - raw_value
  - reported_concentration_pg_ml
  - unit
  - unit_basis
  - dilution_factor
  - dilution_corrected
  - detection_limit_pg_ml
  - collected_volume
  - collection_duration
  - flow_rate
  - value_derivation
  - technical_replicate_n
  - value_is_technical_aggregate
  - condition_interval_id
  - donor_group_id
  - donor_matching_state
  - measurement_state
  - measurement_state_basis
  - quality_tier
  - exclusion_reason
  - uncertainty_flags
  - externally_asserted_fields
  - resolution_note

# Real columns kept ALWAYS EMPTY -- never synthesised -- so each gap is
# machine-visible rather than only living in report prose.
#
# donor_id: identity is never recorded; only opaque group membership, in
#   donor_group_id. See config/source_contract.yaml donor_label_scheme.
# technical_replicate_id / assay_well_id: the annotation workbook gives the
#   COUNT of technical replicates (3 per well) but no per-replicate value and no
#   well identifier, so the count lives in technical_replicate_n and these stay
#   empty. Synthesising 1/2/3 would fabricate a grain the source lacks.
# collection_duration: the day-0 legend states a DISJUNCTION, "medio de 48 h o
#   96 h". Collapsing or averaging it would invent a window; the verbatim
#   disjunction is preserved in config/adoc_outlet_conditions.tsv.
#
# collected_volume and flow_rate were previously in this list and are now
# populated: the annotation workbook states 1 mL collected on all three sheets
# and 30 uL/h flow on the PAEP sheet only (SOFIA-ANNO-003). They are recorded as
# collection metadata and DO NOT license a secretion rate -- see
# secretion_rate_derivable below.
always_empty_columns:
  - donor_id
  - technical_replicate_id
  - assay_well_id
  - collection_duration

# externally_asserted_fields lists, per row, the column names in this same
# row whose value is neither supported by the workbook nor confirmed by the
# collaborator -- i.e. still asserted only from
# docs/data-context/adoc-secreted-proteins.md. Absence from the list therefore
# means "workbook-supported or collaborator-confirmed", never "unsupported";
# read the *_basis columns to tell those two apart.
#
# WHICH FIELDS THOSE CURRENTLY ARE is the key below and NOT this comment. Three
# prose copies of that list drifted apart -- this comment kept naming PRL after
# SOFIA-COMM-006 retired it and `quality_tier` after SOFIA-COMM-007 retired it,
# while the shipped table named neither -- so the list is machine-readable and
# the builder now fails if the emitted column disagrees with it
# (`externally_asserted_fields_match_contract`). Retirements, for the record:
# `unit` left when SOFIA-COMM-001 confirmed pg/mL, PRL's compartment/outlet when
# SOFIA-COMM-006 confirmed the sheet is one outlet, and PAEP S1/S2's
# `quality_tier` when SOFIA-COMM-007 confirmed why those chips are blank.
externally_asserted_fields_current:
  - compartment
  - outlet
# Rows carrying the fields above. PAEP's outlet assignment is the one claim no
# named source has confirmed; every other sheet's list is empty.
externally_asserted_fields_scope: "PAEP rows only"
externally_asserted_fields_delimiter: "|"

# Fields every row must populate. Fields not listed here (chip_id, condition,
# resolved_protocol_day, dilution_factor, detection_limit_pg_ml,
# always_empty_columns, ...) are legitimately empty for some sheets/always
# empty, and are checked by narrower rules below instead of being globally
# required.
required_nonempty:
  - dataset_id
  - source_file
  - source_sheet
  - source_cell
  - source_row
  - source_column
  - protein
  - series_id
  - compartment
  - outlet
  - outlet_assignment_basis
  - compartment_semantics_basis
  - protocol_phase
  - unit
  - unit_basis
  - measurement_state
  - quality_tier

controlled_vocabularies:
  compartment:
    - epithelial
    - stromal
  outlet:
    - top
    - bottom
  # SPLIT DELIBERATELY IN TWO. The retired single column
  # `compartment_assignment_basis` conflated two logically independent claims,
  # and the 2026-07-29 collaborator confirmation resolves only one of them:
  #
  #   outlet_assignment_basis     -- WHICH workbook columns are which outlet.
  #   compartment_semantics_basis -- WHAT an outlet means biologically.
  #
  # The collaborator confirmed the semantics (TOP = apical/epithelial,
  # BOTTOM = basal/stromal) for every row (SOFIA-COMM-003), and separately that
  # the whole PRL sheet was measured from the BOTTOM outlet (SOFIA-COMM-006).
  # PAEP's outlet is STILL unconfirmed and its basis must NOT be promoted --
  # after this correction PAEP is the only row set carrying an unverified outlet
  # assignment, which makes its warning more important, not less.
  #
  # A REASONING-DISCIPLINE RECORD, kept because the correction vindicated it:
  # the repository refused to infer PRL's TOP/BOTTOM split from the day-6
  # magnitude asymmetry, on the grounds that OM-007 tested exactly that
  # inequality and would have become circular. That asymmetry is now known to
  # lie ENTIRELY WITHIN the basal outlet, so the inference would have been not
  # merely circular but wrong. Do not relax the rule for the next sheet.
  # Grain + source + verification state. RETIRED:
  # column_position_context_document_unverified -- PRL was its only consumer and
  # the whole PRL sheet is now a confirmed single outlet, so no column-level
  # claim remains to be verified. The term is named here so a reader grepping
  # for it lands on the explanation; a test asserts it is no longer a VALUE.
  outlet_assignment_basis:
    - workbook_merged_header
    - sheet_level_collaborator_confirmed
    - sheet_level_context_document_unverified
  compartment_semantics_basis:
    - collaborator_confirmed_top_apical_bottom_basal
  unit_basis:
    - collaborator_confirmed
  measurement_state:
    # `no_detectable_secretion` is a MEASUREMENT, not a censored or missing
    # value. It is distinct from `below_detection` (a censored value known only
    # to be under a limit) and from `missing` (no measurement exists).
    # raw_value stays the stored 0 -- never blank, never NA.
    #
    # STRENGTH OF BASIS, read `measurement_state_basis` for the per-row answer.
    # SOFIA-COMM-002 asserts absorbance was read and interpolated against the
    # standard curve. The annotation workbook corroborates the CONCLUSION -- "No
    # hay secreccion" -- on the IGFBP-1 sheet only, but its operative clause is
    # about which number was entered ("pongo directamente los datos de la
    # concentración calculados, no la absorbancia"), which does not itself
    # establish that a read exists for that well, nor exclude a floored negative
    # blank-subtracted absorbance. The state is therefore recorded as
    # operator-asserted, and the interpolation mechanism stays
    # collaborator-only.
    - observed
    - no_detectable_secretion
    - missing
    - below_detection
    - excluded
    - blank_control
    - out_of_range
  quality_tier:
    - primary
    - exploratory
    - excluded
  unit:
    - pg/mL
  condition_normalized:
    - e2_only_48h
    - e2_mpa_camp_xav939_96h
    - pre_cocktail_baseline
  value_derivation:
    - concentration_from_blank_subtracted_absorbance
  measurement_state_basis:
    # The zero note sits on the IGFBP-1 annotation sheet only, so PAEP and PRL
    # zeros rest on the collaborator statement alone. Both terms say
    # "operator_asserted": the note states which number was ENTERED, not that an
    # absorbance read exists for that well, so a verified curve interpolation is
    # NOT claimed and a floored negative blank-subtracted absorbance is not
    # excluded.
    - interpolated_from_blank_subtracted_absorbance
    - operator_asserted_non_detect_annotation_sheet_igfbp1
    - operator_asserted_non_detect_collaborator_statement_only
    - no_measurement_exists
  donor_matching_state:
    - known_both_compartments
    - partial_epithelial_only
    - partial_pair_not_split_per_chip
    - lost_column_assignment
    - unknown
  protocol_phase:
    - e2_proliferative_day0_2
    - full_cocktail_day2_6
    # RESOLVED 2026-07-29 by the annotation workbook: the day-0 sample is
    # medium accumulated while connected with EXPANSION medium, so it precedes
    # hormone addition (SOFIA-ANNO-005). The former term,
    # day0_baseline_e2_exposure_unverified, is retired. Two limits keep this a
    # distinct phase rather than a plain pre-treatment label: the accumulation
    # window is a stated disjunction (48 h OR 96 h), and expansion medium is a
    # growth-factor-containing medium of unrecorded composition, so
    # basal_maternal is the closest available comparator, not a verified match.
    - day0_baseline_expansion_medium_pre_hormone

# Day 0 -> 0, Day 3 -> 3, Day 6 -> 6 directly. Day 7 (seen only on the
# IGFBP-1 sheet) resolves to protocol day 6 because the collaborator confirmed
# the row labelled "Day 7" IS day 6 -- a labelling error in the workbook, not
# an endpoint convention (SOFIA-COMM-003). Corroborating workbook-internal
# evidence: the PRL sheet labels the same third timepoint "Day 6".
# source_time_label keeps the original "Day 7" label verbatim and
# time_resolution_note records the correction.
#
# PAEP rows carry no resolved_protocol_day. The *workbook* records no day axis
# for that sheet; the collaborator's protocol does assign each PAEP condition
# to a day WINDOW (E2-only = days 0-2, cocktail = days 2-6), which is captured
# in protocol_phase, but it does not pin a sampling instant, so a single
# resolved day would be an invention.
#
# WHAT THE TWO ROWS ARE is now confirmed (SOFIA-COMM-007, collaborator-confirmed
# 2026-09-18): they are this protocol's two treatment phases -- "HT" is hormone
# treatment, the E2-only row is the proliferative-phase arm and the
# full-cocktail row the secretory-phase arm. PAEP therefore sits outside the
# day-3 representation problem (which is IGFBP-1 and PRL only), and the
# annotation workbook's Dia 0/2/3/6 legend cells on its PAEP sheet are
# transcribed onto the two INTERVAL rows of config/adoc_outlet_conditions.tsv
# and must not by themselves backfill a day onto a PAEP measurement row.
#
# The invariant is deliberately the conservative one: NO SAMPLED DAY IS
# ASSIGNABLE ON CURRENT EVIDENCE. SOFIA-COMM-007 says what the rows are; it
# does not establish that a sampling instant could never exist or be recovered,
# and this contract does not claim that it could not. The day columns stay in
# the schema and stay empty. An explicit collaborator confirmation of PAEP
# sampling timing would be new evidence: it would be registered as its own
# record, and the builder's paep_conditions_are_phases_not_timepoints check --
# which today fails if a PAEP row resolves to a sampled-timepoint condition, or
# if a timepoint condition declares applies_to_sheets=PAEP -- would be revised
# deliberately alongside it, never silently by an edit that cites only the
# workbook legends.
time_label_resolution_rule: >
  source_time_label preserves the workbook label verbatim (non-breaking space
  normalized to a plain space). resolved_protocol_day maps Day 0 -> 0,
  Day 3 -> 3, Day 6 -> 6, Day 7 -> 6 (with time_resolution_note recording the
  workbook labelling error). PAEP rows carry no resolved_protocol_day: their
  time_resolution_note records that the two rows are treatment phases rather
  than sampled days (SOFIA-COMM-007), so no day is assignable on current
  evidence and the workbook day legends alone may never supply one.

# hours_after_cocktail_start anchors each sampled day to elapsed time in the
# full decidualizing cocktail (SOFIA-COMM-004): day 3 -> 24, day 6 -> 96
# (including the mislabelled "Day 7" rows). Left EMPTY for day-0 rows -- the
# cocktail has not started, and neither 0 nor -48 is defensible while the
# day-0 collection window is unknown -- and EMPTY for all PAEP rows, which
# have no sampling instant.
#
# WALL-CLOCK ONLY. These hours describe the bench schedule. They do NOT
# calibrate MaBoSS time, which stays relative (see config/calibration.yaml
# calibrated_physical_time: false and the time_semantics note at the top of
# config/protocols.yaml).
hours_after_cocktail_start_rule: >
  resolved_protocol_day 3 -> 24 h, 6 -> 96 h, 0 -> empty; PAEP rows -> empty.
  Wall-clock experimental schedule only; never a MaBoSS horizon or rate.

# ValidationReport.status vocabulary. Deliberately not "valid"/"invalid":
# this asserts schema/contract conformance and traceability to the source
# workbook only, never that outlet-column assignment, replicate structure, or
# donor provenance are resolved. Those open questions are surfaced as warnings
# (see below), which never affect status. Units and zero semantics are no
# longer among them -- both are collaborator-confirmed.
status_vocabulary:
  - structurally_valid
  - structurally_invalid

# Known soft spots in the *source workbook* (not defects in this table) that
# validate_secreted_protein_table() always reports as warnings, never errors.
# Each key here is emitted by exactly one warning and is asserted against the
# live warning list by tests, so this list cannot drift into stale prose.
#
# RETIRED by the 2026-07-29 collaborator confirmation:
#   unit_externally_asserted -- pg/mL is confirmed (SOFIA-COMM-001).
#   zero_values_indistinguishable_from_below_detection -- zeros are confirmed
#     measured non-detects (SOFIA-COMM-002).
# The PRL warning is NARROWED, not retired: what TOP/BOTTOM mean is confirmed;
# which PRL columns are which is still unverified.
warning_conditions:
  # prl_outlet_column_positions_unverified was RETIRED by SOFIA-COMM-006 and
  # replaced by the structural count mismatch the correction exposed.
  - prl_column_count_exceeds_named_chip_families
  - paep_sheet_outlet_unverified
  - chip_donor_independence_partially_unknown
  - igfbp1_prl_column_to_chip_mapping_lost
  - igfbp1_day6_paired_zero_columns_possible_dropout

# Replicate structure, as confirmed by the collaborator on 2026-07-29
# (SOFIA-COMM-005). Chip-level detail and the pairwise donor relations live in
# config/adoc_chip_donor_provenance.tsv; this block is the machine-checkable
# prohibition that consumers of the table must honour.
biological_independence_contract:
  chip_is_independent_biological_replicate: false
  basis: SOFIA-COMM-005
  # A CEILING, not a count -- and it TIGHTENED on 2026-07-29 rather than
  # loosening. Five PAEP chips carry values (S11-1, S7.1, S10-2, S7.2,
  # "S11 2"). S7.1 and S7.2 were already known to share patient sources, and the
  # annotation workbook additionally assigns S10-2 the SAME epithelial
  # cell-source group as that pair (SOFIA-ANNO-007, see REL-003 in
  # config/adoc_chip_donor_provenance.tsv). The five chips therefore span at most
  # 2 epithelial source groups and at most 3 source-group pairings.
  #
  # PAEP is an apical/epithelial readout, so the epithelial figure is the
  # governing one for OM-001.
  #
  # UNRATIFIED, and deliberately conservative: whether a shared cell-source group
  # means one patient or one isolate/passage is not stated anywhere. 3 is used
  # because it is strictly more conservative than the previous 4; if the
  # collaborator confirms the groups are patients it drops to 2. It must never be
  # revised upward without evidence.
  max_independent_units_paep_observed: 3
  max_independent_epithelial_source_groups_paep: 2
  max_independent_units_igfbp1: not_determinable
  max_independent_units_prl: not_determinable
  # The column -> chip and column -> patient mapping for these two sheets was
  # lost by the collaborator and cannot be reconstructed from this repository:
  # neither sheet carries a chip identifier in any cell, and the PRL sheet has
  # no header row at all. series_id for these sheets is a POSITIONAL column
  # index, never a chip or donor claim.
  column_to_chip_mapping_lost:
    - IGFBP-1
    - "PRL "
  series_id_semantics: positional_column_index_not_chip

  # Technical replicates are NOT biological replicates (AGENTS.md, Scientific
  # Invariants). 3 wells per sample raises no n, and because neither workbook
  # exposes a per-replicate value and the aggregation function is unstated, no
  # SD, CV, standard error or error bar is derivable from this dataset at all.
  technical_replicates_per_well: 3
  technical_replicate_aggregation: unspecified_in_source
  reported_value_is_technical_aggregate: true
  per_replicate_values_available: false
  dispersion_statistic_derivable: false

  # Epithelial and stromal cells within one chip are not always from the same
  # person, and where the annotation names both compartments for the same chips
  # they are DIFFERENT source groups (PAEP!I2). A chip is therefore an
  # allogeneic epithelial+stromal pairing and there is no "patient" for a chip:
  # a per-patient twin from this dataset is structurally undefined, not merely
  # underpowered.
  chip_is_a_single_patient: false
  epithelial_and_stromal_sources_differ_where_annotated: true

  # The annotation workbook states 1 mL collected (all three sheets) and
  # 30 uL/h flow (PAEP sheet only). They are MUTUALLY INCONSISTENT with the
  # stated windows: 1000 uL / 30 uL/h = 33.3 h, neither 48 h nor 96 h. No
  # hydraulic regime, per-channel split, cell count or secreting area is
  # recorded, and no model version consumes a rate. A concentration therefore
  # still cannot become a secretion rate; the figures make the gap visible
  # rather than closing it.
  secretion_rate_derivable: false
  secretion_rate_basis: >
    1 mL at 30 uL/h implies a 33.3 h window, contradicting both the 48 h and the
    96 h media stated in the day legends. Volume, flow and duration are not
    mutually consistent and no normaliser exists, so any pg/h figure would be
    uninterpretable and unvalidatable.

  forbidden_claims:
    - patient_level_variance
    - paired_donor_analysis
    - personalization_from_this_dataset
    - n_equals_number_of_chips
    - n_equals_number_of_columns
    - within_column_pairing_across_day_rows_for_igfbp1_or_prl
    - component_specific_effect_of_mpa_camp_or_xav939
    - n_equals_number_of_technical_replicates
    - patient_specific_twin_from_this_dataset
    - secretion_rate_from_concentration_and_flow
    - dispersion_or_error_bar_from_technical_replicates
    - cross_day_magnitude_comparison_without_matched_collection_window
    - donor_attribution_of_paep_magnitude_heterogeneity
    - column_assignment_resolved_from_a_partial_chip_set
    # Added with SOFIA-COMM-006. Confirming that all six PRL columns are one
    # outlet makes them LOOK like six replicates of one condition in one
    # compartment. They are not: only 3 chip families are named for those 6
    # columns, so the plausible unit count is at most 3 and possibly fewer.
    - prl_column_count_implies_independent_unit_count
    - cross_column_pairing_within_a_day_for_prl
