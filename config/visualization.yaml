# Visual metadata for the MaBoSS pathway-dynamics animation.
#
# SCOPE: this file carries presentation metadata ONLY -- layout regions,
# colours, ordering, panel membership and short display labels.
#
# It is NOT a biological node list. Node identity, compartment, model role,
# confidence and human-readable label are read from the selected model's
# node_dictionary.tsv; edges and their signs from edge_evidence.tsv; phenotypes
# from phenotype_contract.tsv. A node named here that does not exist in the
# selected model is a configuration error, and this file may not introduce or
# override any biological field. See docs/visualization.md.
#
# Node values rendered from this configuration are P(node = ON) across
# simulated MaBoSS trajectories. They are not concentrations, expression
# levels, secretion amounts or fluxes.

schema_version: "1.0"

# --- Region assignment ----------------------------------------------------
# Precedence: node id prefix decides inputs and phenotype outputs; the
# node_dictionary `compartment` column decides everything else. ECM and
# interface nodes therefore land in the extracellular band even though stromal
# cells strongly regulate them.
prefix_classes:
  IN_: input
  OUT_: output

compartment_classes:
  epithelium: epithelial
  stroma: stromal
  interface: extracellular
  extracellular: extracellular
  stroma_external: extracellular
  input_boundary: input
  shared: input

# --- Compartment presentation --------------------------------------------
# `color` is the saturated end of the probability ramp; `pale` is the P(ON)=0
# end. The ramp is a deterministic linear RGB interpolation between them.
compartments:
  input:
    label: "Protocol inputs and perturbations"
    color: "#2A6F97"
    pale: "#EEF3F7"
    region: top
  epithelial:
    label: "Endometrial luminal epithelium"
    color: "#1B7F5C"
    pale: "#EDF5F1"
    region: left
  extracellular:
    label: "Extracellular matrix / lumen / maternal-embryo interface"
    color: "#A6761D"
    pale: "#F7F3EA"
    region: centre
  stromal:
    label: "Endometrial stromal fibroblasts / decidualizing stromal cells"
    color: "#8C4C9E"
    pale: "#F4EEF6"
    region: right
  output:
    label: "Model phenotype outputs"
    color: "#B03A2E"
    pale: "#F9EEEC"
    region: bottom

# Region bounding boxes in axes fraction (x0, y0, x1, y1) for the network panel.
# Boxes are drawn with a small pad and their titles sit clear above that pad,
# so no title ever overlaps a border or a neighbouring compartment.
regions:
  top: [0.015, 0.868, 0.985, 0.955]
  left: [0.015, 0.168, 0.315, 0.770]
  centre: [0.350, 0.168, 0.650, 0.770]
  right: [0.685, 0.168, 0.985, 0.770]
  bottom: [0.015, 0.020, 0.985, 0.116]

# --- Uncertainty styling --------------------------------------------------
# Structural relay nodes and low-confidence entities get a dashed border so a
# reader cannot mistake an assumed relay for an evidenced mechanism.
uncertainty:
  roles: [structural_uncertainty, latent_state]
  confidences: [assumption, candidate]

# --- Edge styling ---------------------------------------------------------
# Sign and style are static and come from edge_evidence.tsv. Only opacity
# varies with time, following the regulator node's P(ON). That opacity is a
# visual regulator-activity cue -- it is not causal flux, reaction rate, edge
# probability, regulatory strength or pathway flow.
edges:
  activation_color: "#2D6A4F"
  inhibition_color: "#BC4749"
  uncertain_confidences: [assumption, candidate]
  cross_compartment_color: "#4A5568"
  min_alpha: 0.10
  max_alpha: 0.85

# --- Synchronized time-series panels -------------------------------------
# Members are preferred orderings. Nodes absent from the selected model are
# skipped without error, so one configuration serves every registered model.
# The phenotype panel is derived from phenotype_contract.tsv, not listed here.
panels:
  - key: inputs
    title: "Protocol input state (deterministic, not measured)"
    axis_label: "input state"
    members:
      - IN_E2
      - IN_PROGESTIN
      - IN_cAMP
      - IN_XAV939
      - IN_MIFEPRISTONE
      - IN_ANTI_SPP1
      - IN_EMBRYO_PRESENT
      - IN_TROPHECTODERM_COMPETENT
      - IN_EMBRYO_CONTACT
      - IN_ER_STRESS_EXCESS
      - IN_HIGH_ECM_STIFFNESS
  # The three ADOC-measured secreted analytes, on their own panel. Two caveats
  # the caption must carry: S_IGFBP1 and S_PRL share one Boolean rule with no
  # declared rate, so their curves coincide BY CONSTRUCTION and the observed
  # IGFBP-1-before-PRL onset order is not represented; and E_PAEP is an exact
  # alias of E_SECRETORY_STATE. Titled "analytes", never "metabolites" -- the
  # panel-observable guard bans concentration-style naming, correctly, because
  # these are Boolean node states and not amounts.
  - key: secreted_analytes
    title: "ADOC-measured secreted analytes (see caption: shared rule)"
    axis_label: "P(node = ON)"
    members:
      - E_PAEP
      - S_IGFBP1
      - S_PRL
  # Retitled: only E_PAEP and S_IGFBP1 carry an activated ADOC observation
  # mapping, so calling these panels "readouts" overstated them. The measured
  # nodes now live in the analyte panel above and are not duplicated here.
  - key: epithelial_model_states
    title: "Other epithelial model states (not ADOC-measured)"
    axis_label: "P(node = ON)"
    members:
      - E_SPP1_EXPR
      - E_LIF
      - E_HBEGF
      - E_PODXL
      - E_MUC1_BARRIER
  - key: stromal_model_states
    title: "Other stromal model states (not ADOC-measured)"
    axis_label: "P(node = ON)"
    members:
      - S_SPP1
      - S_BMP2
      - S_HAND2
      - S_IL11
  - key: phenotypes
    title: "Phenotype probabilities"
    axis_label: "P(phenotype)"
    source: phenotype_contract
    members: []

