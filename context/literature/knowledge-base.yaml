schema_version: '1.0'
knowledge_base_id: adoc-embryo-adhesion-literature-v0.1.0
generated_on: '2026-07-25'
status: candidate_knowledge_not_canonical_model
scope:
  question: Maternal epithelial and stromal mechanisms that alter embryo adhesion or immediate pre-adhesion receptivity.
  species_priority:
  - human
  - mouse
  - non-human primate
  - closely related mammalian models
  included_cell_types:
  - endometrial epithelium
  - endometrial stroma
  excluded_internal_cell_types:
  - trophoblast/embryo
  - immune
  - endothelial
  externalized_embryo_variables:
  - embryo presence/contact
  - trophectoderm competence
  - hCG
  - embryo-conditioned signal
  target_platform: ADOC MaBoSS baseline, with later PhysiBoSS2 spatial coupling
claim_boundary:
- This is a curated mechanistic hypothesis inventory, not a clinically validated contraceptive or fertility model.
- Expression or association alone does not establish a Boolean edge or rate.
- Candidate nodes and edges must pass repository evidence review before promotion to the executable baseline.
- Temperature, oxygen and pH remain boundary/QC variables because adhesion-specific causal thresholds are not established
  in this corpus.
confidence_scale:
  '9': replicated causal or direct platform anchor
  7-8: strong mechanistic evidence with some species/model transfer
  5-6: plausible and supported but limited replication or indirect transfer
  1-4: context, hypothesis or unresolved direction
calibration_anchors:
  source: REF-020
  conditions:
  - condition: untreated
    stable_adhesion_successes: 0
    n: 12
    fraction: 0.0
    use: baseline calibration
  - condition: hormone_treated
    stable_adhesion_successes: 9
    n: 19
    fraction: 0.47368421052631576
    mean_attachment_hours: 34.1
    sd_attachment_hours: 12.2
    use: calibration
  - condition: hormone_treated_mifepristone
    stable_adhesion_successes: 1
    n: 8
    fraction: 0.125
    use: preferentially held-out validation
  warning: MaBoSS state occupancy is a simulated trajectory frequency, not a clinical implantation probability. Time is relative
    unless separately calibrated.
modules:
- module_id: MOD-01
  name: Hormonal receptive-state induction
  compartments: epithelium;stroma
  summary: E2, progestin/PGR, cAMP and XAV939 establish the ADOC secretory/decidual state; mifepristone antagonizes PGR and
    strongly reduces adhesion.
  evidence: direct ADOC plus conserved uterine biology
  refs: REF-020;REF-001;REF-002
  confidence: 9
  maboss: Keep protocol agents as explicit inputs; do not collapse them into a single hormone switch.
- module_id: MOD-02
  name: LIF-LIFR/GP130-STAT3 attachment gate
  compartments: epithelium;stroma
  summary: Pre-attachment epithelial/glandular LIF activates GP130/STAT3 to remodel the epithelium and enable attachment;
    stromal LIF/STAT3 supports later stabilization.
  evidence: replicated mouse genetics; human expression and cell-model support
  refs: REF-023;REF-024;REF-030;REF-031;REF-032;REF-033;REF-036;REF-038
  confidence: 9
  maboss: Core candidate module; separate epithelial and stromal STAT3 where model size allows.
- module_id: MOD-03
  name: PGR-IHH-NR2F2-BMP2-HAND2 relay
  compartments: epithelium to stroma to epithelium
  summary: Progesterone induces epithelial IHH; stromal NR2F2/BMP2/HAND2 drives decidualization and restrains epithelial estrogen/FGF
    proliferation.
  evidence: replicated mouse conditional genetics; human decidual support
  refs: REF-002;REF-025;REF-026;REF-027;REF-028;REF-029
  confidence: 8
  maboss: Core cross-compartment relay; existing baseline already includes IHH, NR2F2 and BMP2; add HAND2 as first extension.
- module_id: MOD-04
  name: Epithelial anti-adhesive glycocalyx/barrier removal
  compartments: epithelium
  summary: PODXL, full-length DAG1 and some MUC1 states create a non-receptive barrier; receptivity requires downregulation,
    cleavage or glycoform switching.
  evidence: direct human gain-loss and biophysical studies
  refs: REF-011;REF-012;REF-013;REF-014
  confidence: 7
  maboss: Use explicit inhibitory nodes. Split MUC1 barrier and MUC1 sLeX/glyco-permissive states.
- module_id: MOD-05
  name: Human epithelial adhesive surface effectors
  compartments: epithelium
  summary: CD98/CD9, apical CDH1/CTNND1, ANXA2-RHOA-actin, SPP1-integrins and HB-EGF collectively form a receptive adhesive
    surface.
  evidence: human mechanistic, biophysical and descriptive evidence
  refs: REF-006;REF-007;REF-008;REF-009;REF-019;REF-038
  confidence: 7
  maboss: Prefer rate modifiers or redundant OR-gates, not a requirement that every effector be ON.
- module_id: MOD-06
  name: PCSK5 membrane and dystroglycan processing
  compartments: epithelium
  summary: PCSK5/PC6 cleaves EBP50 and alpha-DAG1 N-terminus, reorganizing membrane-cytoskeletal interactions and releasing
    an attachment barrier.
  evidence: direct human knockdown and cleavage studies
  refs: REF-010;REF-011
  confidence: 7
  maboss: Represent PC6 -> DAG1_CLEAVED and DAG1_FULL as an inhibitor.
- module_id: MOD-07
  name: SPP1/OPN-integrin adhesion and decidual support
  compartments: epithelium;stroma;interface
  summary: Epithelial OPN supports interface adhesion while stromal OPN contributes to decidualization; integrin partners
    include alphaVbeta3/5 and ITGB1-related routes.
  evidence: human, primate and cell-model evidence
  refs: REF-007;REF-015;REF-017;REF-022;REF-038
  confidence: 7
  maboss: Keep epithelial and stromal SPP1 separate; anti-SPP1 neutralizes extracellular ligand rather than transcription.
- module_id: MOD-08
  name: Decidualization and dynamic senescence balance
  compartments: stroma with glandular epithelium
  summary: Decidual transformation and a controlled senescence/remodeling program create a dynamic implantation matrix; complete
    removal or excess dysfunction is unfavorable.
  evidence: human assembloid mechanistic evidence
  refs: REF-016
  confidence: 6
  maboss: Use a balanced state or uncertain rule variant, not a simplistic senescence ON=bad rule.
- module_id: MOD-09
  name: TAZ-Hippo ECM remodeling and stromal mechanics
  compartments: stroma
  summary: TAZ/WWTR1 coordinates collagen/ECM remodeling; normal decidualization softens stroma, while excess ER stress prevents
    softening and reduces adhesion/expansion.
  evidence: recent mouse genetics plus human mechanobiology
  refs: REF-018;REF-035
  confidence: 6
  maboss: Add TAZ_ECM and Mechanical_Permissive_ECM; ER stress and excessive stiffness inhibit the mechanical state.
- module_id: MOD-10
  name: Cell-type-specific interaction candidates
  compartments: epithelium;stroma;interface
  summary: LGALS1, LGALS3, ITGB1, BSG and related interactions are receptive-phase candidates from compartment-resolved human
    RNA-seq.
  evidence: human paired cell-type-specific RNA-seq plus in-silico interface inference
  refs: REF-015
  confidence: 5
  maboss: Expansion tier only; use for sensitivity analysis until perturbational evidence exists.
- module_id: MOD-11
  name: Embryo-conditioned feedback
  compartments: external embryo input to epithelium
  summary: Embryo contact and hCG can induce CD98/CD9 and apical CDH1/CTNND1, stabilizing first contact.
  evidence: human direct and cell-model evidence
  refs: REF-008;REF-019;REF-020
  confidence: 7
  maboss: Model hCG/contact as exogenous inputs because trophoblast is outside the current MaBoSS cell types.
- module_id: MOD-12
  name: Uterine WNT-Ca2+-integrin competence cue
  compartments: maternal cue;embryo execution
  summary: Uterine WNT5A/7A rapidly increases embryo alpha5beta1 trafficking and fibronectin binding through CaMKII.
  evidence: mouse mechanistic attachment assays
  refs: REF-034
  confidence: 6
  maboss: Do not implement as maternal intracellular output in the core model; retain as external embryo-competence modifier
    or later PhysiBoSS interface field.
- module_id: MOD-13
  name: Physical microenvironment and transport
  compartments: chip/extracellular
  summary: Flow, oxygen, pH, temperature, ligand presentation and matrix stiffness can alter assay context, transport and
    tissue state, but direct adhesion-specific causal data are uneven.
  evidence: project/NAM context plus mechanics papers; limited direct adhesion perturbation for temperature/pH/O2
  refs: REF-018;REF-020;REF-021
  confidence: 4
  maboss: Stiffness/ER stress may modify rates; temperature, pH, oxygen and flow should initially be boundary/QC variables
    or PhysiCell fields.
