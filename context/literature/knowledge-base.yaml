  evidence_for_adhesion: Directly determines observable adhesion but is outside the current cell-type boundary.
  recommended_representation: external IN_EMBRYO_PRESENT and IN_TROPHECTODERM_COMPETENT
  maboss_action: Never infer maternal failure from a negative adhesion event without embryo-side uncertainty.
