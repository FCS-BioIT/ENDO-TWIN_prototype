  normal_or_reference: platform-specific oxygenation
  evidence_for_adhesion: Biologically plausible and monitored in IMPLANT-MOD, but direct adhesion-specific epithelial/stromal
    thresholds are not established here.
  recommended_representation: microenvironment boundary condition or PhysiCell substrate
  maboss_action: Context input only until measured perturbation data support a sign.
  confidence: 3
- factor_id: ENV-003
