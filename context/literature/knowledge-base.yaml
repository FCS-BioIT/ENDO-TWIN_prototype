  normal_or_reference: approximately 37 C culture/perfusion context
  evidence_for_adhesion: No robust dose-response for maternal epithelial/stromal adhesion identified in the reviewed corpus.
  recommended_representation: metadata/QC and later continuous field
  maboss_action: No causal edge in core model; define IN_TEMPERATURE_STRESS only after ADOC perturbation data.
  confidence: 3
- factor_id: ENV-002
