promotion_policy:
- Do not overwrite v0.4.0.
- Merge literature candidates into the canonical context tables only after citation and species/context review.
- Promote executable nodes/edges only into a new version such as v0.5.0.
- Keep uncertain or context-dependent biology in rule variants or unresolved mechanisms.
- Do not infer kinetic rates directly from expression values.
- Do not interpret raw MaBoSS state occupancy as a calibrated biological adhesion probability until fitted to ADOC
  outcomes.
priority_changes:
- Separate PAEP, PRL and IGFBP1 observation nodes from hard phenotype causality.
- Replace hand-set interface relay priors with finite-time attachment/detachment kinetics.
- Add stromal BMP-SMAD and FOXO1 as first high-value de-aliasing nodes.
- Make existing hCG input functional through CD98/CD9 and apical CDH1 variants.
- Add IL11-STAT3-ITGA2B1 as a mechanistically identified non-SPP1 adhesion route.
- Add SOX17 and an explicit sLeX/glycosylation state.
- Add biochemical ECM support (FN1/COL4 abstraction) alongside mechanics.
- Represent pharmacological perturbations as target-engagement/rate changes where possible, not only Boolean clamps.
