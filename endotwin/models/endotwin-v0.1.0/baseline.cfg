// Default simulation settings for endotwin-v0.1.0.
// MaBoSS time is dimensionless and is not mapped to experimental hours or days.
// Every node starts OFF (basal, unstimulated); the protocol layer
// (endotwin/config/protocols.yaml) sets inputs per phase and carries the full
// joint state distribution across phase boundaries. No node is internal, so the
// joint distribution over all nodes is observable and can be carried forward.

discrete_time = 0;
use_physrandgen = FALSE;
seed_pseudorandom = 1;
sample_count = 5000;
max_time = 20.0;
time_tick = 0.1;
thread_count = 1;
display_traj = FALSE;

