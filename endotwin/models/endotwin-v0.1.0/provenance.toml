]

[changes_from_v060]
summary = "Embryo-adhesion and receptivity module not carried; BMP ligand expression separated from receptor/SMAD activity; BMP receptor inhibition and IL-1beta inputs added; stromal FGF node renamed to a ligand-agnostic paracrine mitogen; three functional output nodes named for the grant readouts; PRL/IGFBP-1 and PAEP marker aliases merged into their outputs."
