transition_rates = "MaBoSS defaults (rate_up = rate_down = 1 for every node); not estimated. This matters more in v0.3.0 than in v0.2.0: the CAM family distinguishes an exogenous from an endogenous route to stromal PKA, and the literature distinguishes them by SPEED (acute versus extended hormone exposure). With no mapping from MaBoSS time to hours, that kinetic distinction is NOT represented. See [changes_from_v020]."

